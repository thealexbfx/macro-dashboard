name: Release 100 rehearsal
on:
  pull_request:
    paths:
      - 'backend/app/catalog/release100.py'
      - 'backend/app/catalog/release_cli.py'
      - 'catalog/refresh_policy.json'
      - 'research/releases/release-100/**'
      - 'scripts/*release100*'
      - '.github/workflows/release100.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual_release_512m:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Python 3.14 isolated test image
        run: docker build --build-arg PYTHON_VERSION=3.14 -f scripts/phase4c.Dockerfile -t macrolens-release100 .
      - name: Audit 185 and capture approved 70 from official sources
        run: |
          mkdir -p "$RUNNER_TEMP/release100-input" "$RUNNER_TEMP/release100-results"
          docker run --rm --memory=512m --memory-swap=512m --cpus=0.5 \
            -v "$RUNNER_TEMP/release100-input:/input" --entrypoint python macrolens-release100 \
            -m backend.app.catalog.release100 prepare --bundle /input/bundle
          cp "$RUNNER_TEMP/release100-input/bundle/audit.json" "$RUNNER_TEMP/release100-results/audit.json"
      - name: Stage, publish, smoke, revoke, restore and republish alongside API and Discovery
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release100-disk"
          truncate -s 1G "$RUNNER_TEMP/release100-disk.img"
          mkfs.ext4 -F "$RUNNER_TEMP/release100-disk.img"
          sudo mount -o loop "$RUNNER_TEMP/release100-disk.img" "$RUNNER_TEMP/release100-disk"
          trap 'sudo umount "$RUNNER_TEMP/release100-disk"' EXIT
          docker run --rm --memory=512m --memory-swap=512m --cpus=0.5 --network=none \
            -e TMPDIR=/disposable -v "$RUNNER_TEMP/release100-disk:/disposable" \
            -v "$RUNNER_TEMP/release100-input:/input:ro" \
            -v "$RUNNER_TEMP/release100-results:/results" --entrypoint python macrolens-release100 \
            -m scripts.validate_release100 --bundle /input/bundle --output /results/capacity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release100-rehearsal
          path: ${{ runner.temp }}/release100-results/
          retention-days: 7
