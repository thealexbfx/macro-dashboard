name: Official CPI connectivity (development)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/feature/g7-fundamental-data-batch1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check certifi pytest
      - name: Probe official publishers
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.g7_cpi_probe | tee "$RUNNER_TEMP/cpi-probe.json"
      - name: Validate two direct development refresh passes
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.verify_g7_cpi_live "$RUNNER_TEMP/cpi-verification" | tee "$RUNNER_TEMP/cpi-refresh.jsonl"
      - name: Test revision and failure retention with simulated responses
        if: always()
        run: python -m pytest backend/tests/test_g7_cpi_refresh.py -q
      - name: Save sanitized verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-cpi-verification
          path: |
            ${{ runner.temp }}/cpi-probe.json
            ${{ runner.temp }}/cpi-refresh.jsonl
          if-no-files-found: ignore
          retention-days: 7
