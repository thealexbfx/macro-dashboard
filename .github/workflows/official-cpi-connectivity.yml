name: Official CPI connectivity (development)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: '1e0014676288b51a21720f58dbc8092aceab09e4'
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check certifi pytest
      - name: Probe official publishers
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.g7_cpi_probe | tee "$RUNNER_TEMP/cpi-probe.json"
      - name: Validate two direct development refresh passes
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.verify_g7_cpi_live "$RUNNER_TEMP/cpi-verification" | tee "$RUNNER_TEMP/cpi-refresh.jsonl"
      - name: Test revision and failure retention with simulated responses
        if: always()
        run: python -m pytest backend/tests/test_g7_cpi_refresh.py -q
      - name: Save sanitized verification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: official-cpi-verification
          path: |
            ${{ runner.temp }}/cpi-probe.json
            ${{ runner.temp }}/cpi-refresh.jsonl
          if-no-files-found: ignore
          retention-days: 7
