name: Dataset expansion Linux validation
on:
  push:
    branches: [feature/macrolens-full-dataset-expansion]
  pull_request:
    paths:
      - 'backend/app/catalog/releases.py'
      - 'backend/app/catalog/release_cli.py'
      - 'backend/app/ingestion/**'
      - 'catalog/release_candidates.json'
      - 'scripts/*expansion*'
      - '.github/workflows/dataset-expansion.yml'
# Keep only the latest head of each PR in the hosted validation queue.
# Never cancel a run from another PR or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  linux_512mb:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated validation image
        run: docker build -f scripts/phase4c.Dockerfile -t macrolens-expansion .
      - name: Capture representative actual official histories under hard limits
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/expansion-data"
          docker run --rm --memory=512m --memory-swap=512m --cpus=0.5 \
            -e EXPANSION_CAPTURE_LABEL=macro \
            -v "$RUNNER_TEMP/expansion-data:/tmp/expansion" --entrypoint python macrolens-expansion \
            -m scripts.measure_expansion_capture --workspace /tmp/expansion --providers eurostat,ons \
            --only-ids eurostat_03b4d5b0fa407ee1b32e ons_24c4972dca3a5b1bbe32
          docker run --rm --memory=512m --memory-swap=512m --cpus=0.5 \
            -e EXPANSION_CAPTURE_LABEL=large-source \
            -v "$RUNNER_TEMP/expansion-data:/tmp/expansion" --entrypoint python macrolens-expansion \
            -m scripts.measure_expansion_capture --workspace /tmp/expansion --providers eia,federal_reserve,boe,dol --overrides \
            --only-ids eia_wti_spot_daily frb_real_yield_10y_daily boe_1d553b5bdd1f7e891b14 fred_b7b05b9474e87c2c4391 fred_848fe5e65c6c554669f1 fred_5e43a009a68bedb42dbf
      - name: Ingest real histories alongside loaded backend and API traffic, offline
        run: |
          docker run --rm --memory=512m --memory-swap=512m --cpus=0.5 --network=none \
            -v "$RUNNER_TEMP/expansion-data:/tmp/expansion" --entrypoint python macrolens-expansion \
            -m scripts.validate_expansion --workspace /tmp/expansion --with-backend \
            --ids eurostat_03b4d5b0fa407ee1b32e ons_24c4972dca3a5b1bbe32 eia_wti_spot_daily frb_real_yield_10y_daily boe_1d553b5bdd1f7e891b14 fred_b7b05b9474e87c2c4391 fred_848fe5e65c6c554669f1 fred_5e43a009a68bedb42dbf
      - name: Retest full synthetic 309-entry workload under the same hard limits
        run: |
          docker run --rm --memory=512m --memory-swap=512m --cpus=0.5 --network=none \
            --entrypoint python macrolens-expansion scripts/validate_batch0_catalog.py
      - name: Rehearse the exact first thirteen histories in an independent disposable database
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/expansion-data/validation.json" "$RUNNER_TEMP/expansion-data/validation-eight.json"
          ids="$(python -c 'import json; print(" ".join(json.load(open("research/releases/first-live/selection.json"))["ids"]))')"
          docker run --rm --memory=512m --memory-swap=512m --cpus=0.5 \
            -v "$RUNNER_TEMP/expansion-data:/tmp/expansion" --entrypoint python macrolens-expansion \
            -m scripts.collect_expansion --workspace /tmp/expansion --providers eurostat,ons,eia --only-ids $ids
          docker run --rm --memory=512m --memory-swap=512m --cpus=0.5 --network=none \
            -v "$RUNNER_TEMP/expansion-data:/tmp/expansion" --entrypoint python macrolens-expansion \
            -m scripts.validate_expansion --workspace /tmp/expansion --database-name disposable-first-thirteen.sqlite3 --ids $ids
          cp "$RUNNER_TEMP/expansion-data/validation.json" "$RUNNER_TEMP/expansion-data/validation-first-thirteen.json"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build standard Linux frontend and install browser test tools
        working-directory: frontend-v2
        env:
          MACROLENS_V2_API_URL: http://127.0.0.1:8140
        run: |
          npm ci
          npm run build
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser checks against the eight actual-history release candidates
        env:
          MACROLENS_V2_API_URL: http://127.0.0.1:8140
          EXPANSION_BROWSER_EXPECTED_PUBLIC: '38'
        run: |
          set -euo pipefail
          docker run -d --name expansion-browser-backend --memory=512m --memory-swap=512m --cpus=0.5 --network=host \
            -v "$RUNNER_TEMP/expansion-data:/tmp/expansion" --entrypoint python macrolens-expansion \
            -m scripts.serve_expansion_preview --workspace /tmp/expansion --database-name disposable-release.sqlite3
          (cd frontend-v2 && node node_modules/next/dist/bin/next start -H 127.0.0.1 -p 3040) > /tmp/expansion-frontend.log 2>&1 &
          frontend_pid=$!
          trap 'kill "$frontend_pid" || true; docker rm -f expansion-browser-backend || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3040/ > /dev/null && curl -fsS http://127.0.0.1:8140/health > /dev/null; then break; fi
            sleep 1
          done
          python -m scripts.test_expansion_browser
          docker rm -f expansion-browser-backend
          docker run -d --name expansion-browser-backend --memory=512m --memory-swap=512m --cpus=0.5 --network=host \
            -v "$RUNNER_TEMP/expansion-data:/tmp/expansion" --entrypoint python macrolens-expansion \
            -m scripts.serve_expansion_preview --workspace /tmp/expansion --database-name disposable-first-thirteen.sqlite3
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8140/health > /dev/null; then break; fi
            sleep 1
          done
          python -m scripts.smoke_first_release --origin http://127.0.0.1:8140 --activated
          python -m scripts.smoke_first_release --origin http://127.0.0.1:3040 --activated
          EXPANSION_BROWSER_EXPECTED_PUBLIC=43 \
            EXPANSION_BROWSER_DATASET=eia_4922b423fe8b2b32866f \
            EXPANSION_BROWSER_NAME='US commercial crude stocks excluding SPR' \
            EXPANSION_BROWSER_ARTIFACTS=/tmp/first-release-browser \
            python -m scripts.test_expansion_browser
      - name: Retain measurements and metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expansion-linux-measurements-${{ github.event_name }}
          path: |
            ${{ runner.temp }}/expansion-data/validation.json
            ${{ runner.temp }}/expansion-data/validation-eight.json
            ${{ runner.temp }}/expansion-data/validation-first-thirteen.json
            ${{ runner.temp }}/expansion-data/source-results.json
            ${{ runner.temp }}/expansion-data/capture-*-metrics.json
            /tmp/expansion-browser/
            /tmp/first-release-browser/
            /tmp/expansion-frontend.log
          retention-days: 7
