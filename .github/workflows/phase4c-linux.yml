name: Phase 4C Linux resource validation
on:
  push:
    branches: [feature/macrolens-v2, feature/macrolens-batch0-foundation]
    paths:
      - '.github/workflows/phase4c-linux.yml'
      - 'scripts/*phase4c*'
      - 'scripts/linux_cgroup.py'
      - 'scripts/build_resource_workbook.py'
      - 'scripts/validate_phase4b.py'
      - 'backend/app/ingestion/**'
      - 'backend/app/v2/**'
      - 'backend/app/catalog/**'
      - 'catalog/**'
      - 'scripts/validate_batch0_foundation.py'
      - 'scripts/batch0_partition_fixture.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux_512mb:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [disabled, enabled]
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated test image
        run: docker build -f scripts/phase4c.Dockerfile -t macrolens-phase4c .
      - name: Build labelled synthetic resource workbook
        run: python3 scripts/build_resource_workbook.py "$RUNNER_TEMP/phase4c-input/worldbank.xlsx"
      - name: Measure offline Batch 0 manifest and restore probe within 512 MiB
        run: |
          docker run --rm --memory=512m --memory-swap=512m --cpus=0.5 --network=none \
            --entrypoint python macrolens-phase4c scripts/validate_batch0_foundation.py
      - name: Run backend under hard Linux limits with external clients
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          mountpoint="$(dirname "$GITHUB_WORKSPACE")/phase4b-staging"
          image="$RUNNER_TEMP/phase4c-disk.img"
          mkdir -p "$mountpoint" "$RUNNER_TEMP/phase4c-artifacts"
          truncate -s 1G "$image"
          mkfs.ext4 -F "$image"
          sudo mount -o loop "$image" "$mountpoint"
          sudo chown "$(id -u):$(id -g)" "$mountpoint"
          trap 'docker rm -f macrolens-phase4c >/dev/null 2>&1 || true; sudo umount "$mountpoint" || true' EXIT
          set +e
          sudo -E python3 scripts/validate_phase4c.py --mode "$MODE" --workbook "$RUNNER_TEMP/phase4c-input/worldbank.xlsx" --docker-image macrolens-phase4c
          code=$?
          set -e
          cp "$RUNNER_TEMP/phase4c-input/worldbank.json" "$RUNNER_TEMP/phase4c-artifacts/resource-fixture.json"
          docker image inspect macrolens-phase4c > "$RUNNER_TEMP/phase4c-artifacts/image.json"
          docker cp macrolens-phase4c:/runtime-packages.txt "$RUNNER_TEMP/phase4c-artifacts/runtime-packages.txt" || true
          for file in "$mountpoint"/phase4c-*.json "$mountpoint"/linux-*/results.json "$mountpoint"/linux-*/partial-results.json "$mountpoint"/linux-*/server.log "$mountpoint"/linux-*/docker-states.json; do
            if [ -f "$file" ]; then cp "$file" "$RUNNER_TEMP/phase4c-artifacts/"; fi
          done
          exit "$code"
      - name: Retain measurements only (no database or workbook)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4c-${{ matrix.mode }}
          path: ${{ runner.temp }}/phase4c-artifacts/
          retention-days: 7
          if-no-files-found: warn

