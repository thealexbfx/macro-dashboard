name: Phase 4C Linux resource validation
on:
  push:
    branches: [feature/macrolens-v2]
    paths:
      - '.github/workflows/phase4c-linux.yml'
      - 'scripts/*phase4c*'
      - 'scripts/linux_cgroup.py'
      - 'scripts/build_resource_workbook.py'
      - 'scripts/validate_phase4b.py'
      - 'backend/app/ingestion/**'
      - 'backend/app/v2/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux_512mb:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [disabled, enabled]
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated test image
        run: docker build -f scripts/phase4c.Dockerfile -t macrolens-phase4c .
      - name: Build labelled synthetic resource workbook
        run: python3 scripts/build_resource_workbook.py "$RUNNER_TEMP/phase4c-input/worldbank.xlsx"
      - name: Run under hard Linux limits
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          mountpoint="$RUNNER_TEMP/phase4c-disk"
          image="$RUNNER_TEMP/phase4c-disk.img"
          mkdir -p "$mountpoint" "$RUNNER_TEMP/phase4c-artifacts"
          truncate -s 1G "$image"
          mkfs.ext4 -F "$image"
          sudo mount -o loop "$image" "$mountpoint"
          trap 'docker rm -f macrolens-phase4c >/dev/null 2>&1 || true; sudo umount "$mountpoint" || true' EXIT
          docker create --name macrolens-phase4c --memory=512m --memory-swap=512m --cpus=0.5 --network=none \
            -v "$mountpoint:/workspace/phase4b-staging" \
            -v "$RUNNER_TEMP/phase4c-input:/input:ro" \
            macrolens-phase4c python scripts/validate_phase4c.py --mode "$MODE" --workbook /input/worldbank.xlsx
          set +e
          python3 scripts/phase4c_host_metrics.py macrolens-phase4c "$RUNNER_TEMP/phase4c-artifacts"
          code=$?
          set -e
          cp "$RUNNER_TEMP/phase4c-input/worldbank.json" "$RUNNER_TEMP/phase4c-artifacts/resource-fixture.json"
          docker logs macrolens-phase4c > "$RUNNER_TEMP/phase4c-artifacts/container.log" 2>&1
          docker cp macrolens-phase4c:/runtime-packages.txt "$RUNNER_TEMP/phase4c-artifacts/runtime-packages.txt"
          docker image inspect macrolens-phase4c > "$RUNNER_TEMP/phase4c-artifacts/image.json"
          find "$mountpoint" -type f \( -name results.json -o -name partial-results.json -o -name 'phase4c-*.json' -o -name server.log \) -exec cp {} "$RUNNER_TEMP/phase4c-artifacts/" \;
          exit "$code"
      - name: Retain measurements only (no database or workbook)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4c-${{ matrix.mode }}
          path: ${{ runner.temp }}/phase4c-artifacts/
          retention-days: 7
          if-no-files-found: warn

