name: G7 Core Batch 1 audit (development)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 'bd8c82d747627cc66820727f12f7fd001e214eae' # Reviewed BOJ historical development commit
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Record audited commit
        run: git rev-parse HEAD
      - name: Install and check PDF text extraction
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          command -v pdftotext
          pdftotext -v
      - name: Test verifier with mocked transport
        run: node --test verification/g7-core-batch1/*.test.mjs
      - name: Retrieve publisher evidence
        run: node verification/g7-core-batch1/verify.mjs "$RUNNER_TEMP/g7-core-batch1"
      - name: Verify historical BOJ decisions and reconcile annual indexes
        run: node verification/g7-core-batch1/boj-historical-policy.mjs "$RUNNER_TEMP/g7-core-batch1"
      - name: Probe BOJ historical gap source connectivity (not economic verification)
        run: node verification/g7-core-batch1/boj-historical-gap-sources.mjs "$RUNNER_TEMP/g7-core-batch1"
      - name: Upload sanitized reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g7-core-batch1-verification
          path: ${{ runner.temp }}/g7-core-batch1/
          if-no-files-found: error
          retention-days: 7
