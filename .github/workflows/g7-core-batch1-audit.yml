name: G7 Core Batch 1 audit (development)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: '468be3152ebbb54ed0560fb18df4a0ee123cb450' # Reviewed draft PR #34 development feature commit
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Record audited commit
        run: git rev-parse HEAD
      - name: Test verifier with mocked transport
        run: node --test verification/g7-core-batch1/*.test.mjs
      - name: Retrieve publisher evidence
        run: node verification/g7-core-batch1/verify.mjs "$RUNNER_TEMP/g7-core-batch1"
      - name: Upload sanitized reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g7-core-batch1-verification
          path: ${{ runner.temp }}/g7-core-batch1/
          if-no-files-found: error
          retention-days: 7
